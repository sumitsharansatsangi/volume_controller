name: volume_controller
description: A Flutter volume plugin for multiple platform to control system volume.
version: 3.3.3
homepage: https://github.com/kurenai7968/volume_controller
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface:
   git: https://github.com/kumsumit/plugin_platform_interface.git  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurenai7968.volume_controller
        pluginClass: VolumeControllerPlugin
      ios:
        pluginClass: VolumeControllerPlugin
      macos:
        pluginClass: VolumeControllerPlugin
      windows:
        pluginClass: VolumeControllerPluginCApi
      linux:
        pluginClass: VolumeControllerPlugin
